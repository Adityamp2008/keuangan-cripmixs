<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Keuangan Cripmixs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .no-print { display: block; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px !important; }
            .no-print { display: none !important; }
        }
    </style>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                })
                .catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
        });
    }
</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="loader" class="fixed inset-0 bg-white bg-opacity-75 z-50 flex items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-600"></div>
    </div>

    <div class="container mx-auto max-w-4xl p-4">
        <div id="print-area">
            <header class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-blue-700">Keuangan Cripmixs</h1>
                    <p class="text-sm text-gray-500">Ringkasan Keuangan Anda</p>
                </div>
                <button id="logout-btn" class="no-print bg-red-500 text-white px-3 py-2 rounded-lg shadow hover:bg-red-600 transition text-sm">Logout</button>
            </header>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4 mb-6">
                <div class="bg-green-100 p-4 rounded-xl shadow-md">
                    <h2 class="text-sm font-semibold text-green-800">Pemasukan</h2>
                    <p id="total-pemasukan" class="text-xl sm:text-2xl font-bold text-green-700 mt-1">Rp 0</p>
                </div>
                <div class="bg-red-100 p-4 rounded-xl shadow-md">
                    <h2 class="text-sm font-semibold text-red-800">Pengeluaran</h2>
                    <p id="total-pengeluaran" class="text-xl sm:text-2xl font-bold text-red-700 mt-1">Rp 0</p>
                </div>
                <div class="bg-blue-100 p-4 rounded-xl shadow-md col-span-2 md:col-span-1">
                    <h2 class="text-sm font-semibold text-blue-800">Saldo Akhir</h2>
                    <p id="saldo-akhir" class="text-xl sm:text-2xl font-bold text-blue-700 mt-1">Rp 0</p>
                </div>
            </div>
             <h2 class="text-xl font-bold text-gray-800 mb-4">Riwayat Transaksi</h2>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mb-4 no-print">
            <button id="add-data-btn" class="w-full sm:w-auto bg-blue-600 text-white font-semibold px-5 py-2.5 rounded-lg shadow hover:bg-blue-700 transition flex items-center justify-center gap-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                Tambah
            </button>
            <input type="search" id="search-input" placeholder="Cari transaksi..." class="w-full sm:flex-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            <button id="print-all-btn" class="w-full sm:w-auto bg-gray-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow hover:bg-gray-800 transition flex items-center justify-center gap-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v6a2 2 0 002 2h12a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" /></svg>
                Cetak
            </button>
        </div>

        <div id="data-list-container" class="space-y-3">
            </div>
    </div>
    
    <div id="form-modal" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold">Transaksi Baru</h3>
                <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <form id="data-form" class="space-y-4">
                <div><label for="tanggal" class="block text-sm font-medium text-gray-700">Tanggal</label><input type="date" id="tanggal" name="tanggal" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></div>
                <div><label for="jenis" class="block text-sm font-medium text-gray-700">Jenis</label><select id="jenis" name="jenis" required class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"><option value="Pemasukan">Pemasukan</option><option value="Pengeluaran">Pengeluaran</option></select></div>
                <div><label for="kategori" class="block text-sm font-medium text-gray-700">Kategori</label><input type="text" id="kategori" name="kategori" placeholder="Contoh: Penjualan Produk, ATK" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></div>
                <div><label for="deskripsi" class="block text-sm font-medium text-gray-700">Deskripsi</label><textarea id="deskripsi" name="deskripsi" rows="2" placeholder="Deskripsi singkat transaksi" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea></div>
                <div><label for="jumlah" class="block text-sm font-medium text-gray-700">Jumlah (Rp)</label><input type="number" id="jumlah" name="jumlah" placeholder="50000" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></div>
                <div class="flex justify-end pt-2"><button type="submit" id="submit-btn" class="bg-blue-600 text-white font-semibold px-6 py-2 rounded-lg shadow hover:bg-blue-700 transition">Simpan</button></div>
            </form>
        </div>
    </div>
    
    <div id="print-single-template" class="hidden">
        </div>

    <script src="dashboard.js"></script>
</body>
</html>
