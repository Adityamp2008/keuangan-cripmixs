<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Keuangan Cripmixs</title>

  <!-- PWA -->
  <meta name="theme-color" content="#ffffff"/>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/000000/FFFFFF?text=KC">

  <!-- Tailwind + FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .spinner {
      border-top-color: #3498db;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <div class="container mx-auto max-w-5xl p-4 space-y-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Dashboard Keuangan</h1>
      <div class="flex gap-2">
        <div class="relative">
          <input type="text" id="searchInput" placeholder="Cari deskripsi..." 
                 class="pl-8 pr-3 py-2 w-64 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
          <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
        <button id="printAllBtn" class="px-4 py-2 bg-gray-700 text-white rounded-md hover:bg-gray-800 flex items-center gap-2">
          <i class="fa fa-print"></i><span class="hidden sm:inline">Cetak Semua</span>
        </button>
        <button id="logoutBtn" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">
          <i class="fa fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <!-- Summary -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
        <h2 class="text-gray-500">Total Pemasukan</h2>
        <p id="totalPemasukan" class="text-2xl font-semibold text-green-600 mt-2">Rp 0</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow border-l-4 border-red-500">
        <h2 class="text-gray-500">Total Pengeluaran</h2>
        <p id="totalPengeluaran" class="text-2xl font-semibold text-red-600 mt-2">Rp 0</p>
      </div>
    </section>

    <!-- Form Input -->
    <section class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-xl font-bold mb-4">Tambah Transaksi</h2>
      <form id="transactionForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        <div>
          <label for="type" class="block text-sm font-medium">Tipe</label>
          <select id="type" required class="mt-1 w-full border rounded-md p-2">
            <option value="Pemasukan">Pemasukan</option>
            <option value="Pengeluaran">Pengeluaran</option>
          </select>
        </div>
        <div>
          <label for="amount" class="block text-sm font-medium">Jumlah (Rp)</label>
          <input type="number" id="amount" required placeholder="50000" class="mt-1 w-full border rounded-md p-2">
        </div>
        <div>
          <label for="description" class="block text-sm font-medium">Deskripsi</label>
          <input type="text" id="description" required placeholder="Contoh: Beli bahan baku" class="mt-1 w-full border rounded-md p-2">
        </div>
        <button type="submit" id="submitBtn" class="bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 flex justify-center gap-2">
          <span id="submitBtnText">Simpan</span>
          <div id="submitSpinner" class="spinner w-4 h-4 rounded-full border-2 border-t-transparent hidden"></div>
        </button>
      </form>
    </section>

    <!-- History Table -->
    <section class="bg-white rounded-lg shadow overflow-hidden">
      <div class="p-4">
        <h2 class="text-xl font-bold">Riwayat Transaksi</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-gray-100 text-gray-600 uppercase">
            <tr>
              <th class="px-6 py-3">Tipe</th>
              <th class="px-6 py-3">Jumlah</th>
              <th class="px-6 py-3">Deskripsi</th>
              <th class="px-6 py-3">Tanggal</th>
              <th class="px-6 py-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr id="loadingState">
              <td colspan="5" class="text-center p-6">
                <div class="flex justify-center items-center gap-3">
                  <div class="spinner w-6 h-6 rounded-full border-4 border-t-transparent"></div>
                  <span>Memuat data...</span>
                </div>
              </td>
            </tr>
            <tr id="emptyState" class="hidden">
              <td colspan="5" class="text-center p-6 text-gray-500">Belum ada data transaksi.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- External JS -->
  <script src="dashboard.js"></script>
</body>
</html>
