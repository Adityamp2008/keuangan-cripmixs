<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Keuangan Cripmixs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-sm p-8 space-y-6 bg-white rounded-xl shadow-lg">
        <div class="text-center">
            <svg class="mx-auto h-12 w-auto text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.75A.75.75 0 013 4.5h.75m0 0h.75A.75.75 0 015.25 6v.75m0 0v.75A.75.75 0 014.5 8.25h-.75m0 0H3.75a.75.75 0 01-.75-.75V7.5m0 0v-.75A.75.75 0 013 6h.75M7.5 12h-.75a.75.75 0 00-.75.75v.75h.75V12zm-.75 3h.75v-.75h-.75v.75zm.75-3a.75.75 0 01.75.75v.75h-.75V12zm2.25 0h.75v-.75h-.75v.75zM12 15h.75v-.75h-.75v.75zm0 2.25h.75v-.75h-.75v.75zM12 9.75h.75v-.75h-.75v.75zm.75-3h-.75A.75.75 0 0012 6v.75h.75V6.75zm-1.5 0h.75v-.75h-.75v.75zm-3 3h.75v-.75h-.75v.75zm0 3h.75v-.75h-.75v.75zM9 6.75h.75v-.75H9v.75zM15 12h2.25a.75.75 0 01.75.75v.75a.75.75 0 01-.75.75H15v-1.5zm.75-3a.75.75 0 00-.75.75v.75h.75V9.75zm-1.5 0A.75.75 0 0012 9v.75h.75V9.75h.75v.75h.75V9A.75.75 0 0015 8.25h-1.5zm-3 0a.75.75 0 00-.75.75v.75h.75V9.75zm-1.5 0A.75.75 0 009 9v.75h.75V9.75h.75v.75h.75V9A.75.75 0 0012 8.25H9.75zM4.5 15.75A.75.75 0 015.25 15h.75a.75.75 0 01.75.75v.75h-.75A.75.75 0 015.25 15h-.75v.75z" />
            </svg>
            <h1 class="mt-4 text-3xl font-bold text-gray-900">Keuangan Cripmixs</h1>
            <p class="mt-2 text-sm text-gray-600">Silakan login untuk melanjutkan</p>
        </div>
        <form id="loginForm" class="mt-8 space-y-6">
            <div>
                <label for="password" class="sr-only">Password</label>
                <input id="password" name="password" type="password" required class="relative block w-full appearance-none rounded-md border border-gray-300 px-3 py-3 text-gray-900 placeholder-gray-500 focus:z-10 focus:border-blue-500 focus:outline-none focus:ring-blue-500 sm:text-sm" placeholder="Password Perusahaan">
            </div>
            <p id="error-message" class="text-sm text-red-600 text-center"></p>
            <div>
                <button type="submit" class="group relative flex w-full justify-center rounded-md border border-transparent bg-blue-600 py-3 px-4 text-sm font-semibold text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Masuk
                </button>
            </div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('error-message');
        // Ganti '12345' dengan password rahasia perusahaanmu
        const CORRECT_PASSWORD = '12345'; 

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            if (password === CORRECT_PASSWORD) {
                // Simpan status login di session storage agar aman
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                errorMessage.textContent = 'Password yang Anda masukkan salah.';
                document.getElementById('password').classList.add('border-red-500');
            }
        });
    </script>
</body>
</html>
