<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form ke Google Sheet</title>
</head>
<body>
<h2>Form Kontak</h2>

<form id="myForm">
  <input type="text" name="nama" placeholder="Nama" required><br><br>
  <input type="email" name="email" placeholder="Email" required><br><br>
  <textarea name="pesan" placeholder="Pesan" required></textarea><br><br>
  <button type="submit">Kirim</button>
</form>

<script>
document.getElementById('myForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const data = {
    nama: e.target.nama.value,
    email: e.target.email.value,
    pesan: e.target.pesan.value
  };

  try {
    const response = await fetch('https://script.google.com/macros/s/AKfycby840BkBCIBz3hSP6ScCpD3Ie5qDe_188nvBmQb1OlRz5PnigruHP-Me4NiGAYE_1m9/exec', {
      method: 'POST',
      body: JSON.stringify(data)
    });
    const result = await response.json();
    
    if(result.status === 'success') {
      alert('Data berhasil dikirim!');
      e.target.reset();
    } else {
      alert('Error: ' + result.message);
    }
  } catch(err) {
    alert('Terjadi error: ' + err.message);
  }
});
</script>
</body>
</html>
